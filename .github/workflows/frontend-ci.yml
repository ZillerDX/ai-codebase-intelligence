name: Frontend CI (Angular 22)

# Tests, colour-contrast check and a production build on every change to the frontend.
# Deployment is done by Cloudflare Pages (Git integration), not by this workflow.

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/codebase-intelligence-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/codebase-intelligence-web/.node-version
          cache: npm
          cache-dependency-path: frontend/codebase-intelligence-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check colour contrast
        run: node scripts/check-contrast.mjs

      - name: Run tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
